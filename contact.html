<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us | Arjun Real Estate</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --text-dark: #1f2937;
            --text-muted: #6b7280;
            --bg-light: #f9fafb;
            --border: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.6;
        }

        header {
            background: white;
            border-bottom: 1px solid var(--border);
            padding: 15px 30px;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: var(--text-dark);
            margin-left: 20px;
            font-weight: 500;
        }

        nav a:hover {
            color: var(--primary);
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 0 20px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        p.subtitle {
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .contact-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 30px;
            display: grid;
            gap: 20px;
        }

        .contact-item {
            display: flex;
            flex-direction: column;
        }

        .contact-item span {
            font-size: 14px;
            color: var(--text-muted);
        }

        .contact-item a {
            color: var(--primary);
            text-decoration: none;
            font-size: 18px;
            margin-top: 4px;
            word-break: break-all;
        }

        .contact-item a:hover {
            text-decoration: underline;
        }

        .whatsapp-btn {
            display: inline-block;
            margin-top: 20px;
            background: #25D366;
            color: white;
            padding: 14px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            text-align: center;
            width: fit-content;
        }

        .whatsapp-btn:hover {
            background: #1ebe5d;
        }

        footer {
            text-align: center;
            padding: 20px;
            margin-top: 60px;
            font-size: 14px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<header>
    <nav>
        <strong>Arjun Real Estate</strong>
        <div>
            <a href="index.html">Home</a>
            <a href="properties.html">Properties</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>
</header>

<main class="container">
    <h1>Contact Us</h1>
    <p class="subtitle">
        Get in touch with us for property inquiries, site visits, or consultations.
    </p>

    <div class="contact-card">
        <div class="contact-item">
            <span>Phone / WhatsApp</span>
            <a href="https://wa.me/911234567890" target="_blank">
                +91 12345 67890
            </a>
        </div>

        <div class="contact-item">
            <span>Email</span>
            <a href="mailto:careers.codersverse@gmail.com">
                careers.codersverse@gmail.com
            </a>
        </div>

        <div class="contact-item">
            <span>Instagram</span>
            <a href="https://instagram.com/coders.verse" target="_blank">
                @coders.verse
            </a>
        </div>

        <a class="whatsapp-btn" href="https://wa.me/911234567890" target="_blank">
            Chat on WhatsApp
        </a>
    </div>
</main>

<footer>
    © 2026 Arjun Real Estate. All rights reserved.
</footer>

</body>
</html>
