<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Properties | Arjun Real Estate</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      background: #f9fafb;
      color: #1f2937;
    }

    header {
      background: #ffffff;
      padding: 15px 20px;
      border-bottom: 1px solid #e5e7eb;
    }

    header nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header a {
      text-decoration: none;
      color: #2563eb;
      font-weight: bold;
      margin-left: 15px;
    }

    main {
      padding: 20px;
      max-width: 1000px;
      margin: auto;
    }

    h1 {
      margin-bottom: 20px;
    }

    .area-section {
      margin-bottom: 40px;
    }

    .area-title {
      font-size: 22px;
      margin-bottom: 15px;
      border-bottom: 2px solid #2563eb;
      display: inline-block;
    }

    .property-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .property-media {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .property-info h3 {
      margin: 5px 0;
    }

    .property-info p {
      margin: 4px 0;
      color: #4b5563;
    }

    .status {
      font-weight: bold;
      margin-top: 6px;
    }

    .status.available {
      color: green;
    }

    .status.sold {
      color: red;
    }

    .cta {
      display: inline-block;
      margin-top: 10px;
      background: #25d366;
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

<header>
  <nav>
    <strong>Arjun Real Estate</strong>
    <div>
      <a href="index.html">Home</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>
</header>

<main>
  <h1>Available Properties</h1>
  <div id="properties-container"></div>
</main>

<script>
  fetch("data/properties.json")
    .then(response => response.json())
    .then(properties => {
      const container = document.getElementById("properties-container");

      if (properties.length === 0) {
        container.innerHTML = "<p>No properties available at the moment.</p>";
        return;
      }

      const groupedByArea = {};

      properties.forEach(property => {
        if (!groupedByArea[property.area]) {
          groupedByArea[property.area] = [];
        }
        groupedByArea[property.area].push(property);
      });

      for (const area in groupedByArea) {
        const section = document.createElement("div");
        section.className = "area-section";

        const title = document.createElement("h2");
        title.className = "area-title";
        title.textContent = area;
        section.appendChild(title);

        groupedByArea[area].forEach(p => {
          const card = document.createElement("div");
          card.className = "property-card";

          if (p.mediaType === "image") {
            const img = document.createElement("img");
            img.src = p.mediaUrl;
            img.className = "property-media";
            card.appendChild(img);
          }

          if (p.mediaType === "video") {
            const video = document.createElement("video");
            video.src = p.mediaUrl;
            video.controls = true;
            video.className = "property-media";
            card.appendChild(video);
          }

          const info = document.createElement("div");
          info.className = "property-info";

          info.innerHTML = `
            <h3>${p.type}</h3>
            <p>Price: ${p.price}</p>
            <p class="status ${p.status.toLowerCase()}">${p.status}</p>
            <a class="cta" href="https://wa.me/911234567890" target="_blank">
              Enquire on WhatsApp
            </a>
          `;

          card.appendChild(info);
          section.appendChild(card);
        });

        container.appendChild(section);
      }
    })
    .catch(() => {
      document.getElementById("properties-container").innerHTML =
        "<p>Failed to load properties.</p>";
    });
</script>

</body>
</html>
